name: REN Visual Generate

on:
  workflow_dispatch:
    inputs:
      job_ids:
        description: "Comma-separated GENERATION_JOBS ids"
        required: true
        default: "C04.Hero_Master"
      quality:
        description: "OpenAI image quality"
        required: true
        default: "high"
        type: choice
        options:
          - high
          - medium
          - low

permissions:
  contents: write

# Never run two generation batches at once (avoids racing pushes to the same branch).
concurrency:
  group: ren-visual-generate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      REN_IMAGE_MODEL: gpt-image-2
      REN_IMAGE_QUALITY: ${{ inputs.quality }}

    steps:
      - name: Checkout current branch
        id: checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Verify secret exists
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY repository secret is missing."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install visual factory dependencies
        run: python -m pip install -r Scripts/REN_Visual/requirements.txt

      - name: Audit before generation
        run: python Scripts/REN_Visual/ren_visual.py audit

      # Each job runs independently: a refused/failed image is recorded as FAILED in
      # LAST_GITHUB_GENERATION.json and the batch continues. This step only fails for
      # infrastructure/config errors (corrupt queue, unknown ids, >8 requests, unwritable output).
      # Max 8 image API requests per run; no automatic retries inside the runner.
      - name: Generate requested candidates
        id: generate
        run: |
          python Scripts/REN_Visual/github_generate_batch.py \
            --job-ids "${{ inputs.job_ids }}" \
            --quality "${{ inputs.quality }}"

      - name: Audit after generation
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        continue-on-error: true
        run: python Scripts/REN_Visual/ren_visual.py audit

      # Always persist whatever was generated, even if a later or earlier step failed.
      - name: Commit generated candidates
        id: persist
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        shell: bash
        run: |
          git config user.name "REN Visual Factory"
          git config user.email "ren-visual-factory@users.noreply.github.com"
          git add ProjectDocs/References
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "art: generate REN visual candidates"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # Safety net: if persisting to the branch failed, keep the paid outputs as a run artifact.
      - name: Upload outputs if commit/push failed
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.persist.outcome != 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: ren-visual-outputs-${{ github.run_id }}
          path: |
            ProjectDocs/References/LAST_GITHUB_GENERATION.json
            ProjectDocs/References/**/*.png
          retention-days: 14
